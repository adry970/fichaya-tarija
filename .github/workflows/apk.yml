# Compila el APK de FichaYa Tarija en los servidores de GitHub
# y lo publica en Releases (v1.0.0) para descargarlo.
name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Generar el proyecto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Nombre del archivo y SHA-256
        id: apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk grupo02-fichayatarija-v1.0.0.apk
          SHA=$(sha256sum grupo02-fichayatarija-v1.0.0.apk | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "**FichaYa Tarija v1.0.0** · Grupo 02 · Aplicaciones Móviles I · UPDS Tarija"
            echo
            echo "Descarga \`grupo02-fichayatarija-v1.0.0.apk\` e instálala en un celular Android (permitir «orígenes desconocidos»)."
            echo
            echo "SHA-256: \`$SHA\`"
          } > notas.md
          cat notas.md

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: FichaYa Tarija v1.0.0
          body_path: notas.md
          files: grupo02-fichayatarija-v1.0.0.apk
          make_latest: true
